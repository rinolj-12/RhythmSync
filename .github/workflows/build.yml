name: Build RhythmSync (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RhythmSync.sln

      - name: Run automated tests
        run: dotnet test RhythmSync.sln -c Release --no-restore --filter "Category!=Hardware&Category!=Smoke"

      - name: Publish RhythmSync.exe (Single-file, self-contained)
        run: |
          dotnet publish src/RhythmSync.App/RhythmSync.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o ./publish

      - name: Upload RhythmSync.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhythmSync-win-x64
          path: ./publish/RhythmSync.exe
          if-no-files-found: error
